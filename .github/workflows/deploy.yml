name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Publishes dist/ to a dedicated gh-pages branch, which the repo's
      # Pages source should point at (Settings -> Pages -> Deploy from a
      # branch -> gh-pages -> /(root)). Simpler and less error-prone than
      # the "Source: GitHub Actions" setting, which needs to be selected
      # just right and didn't stick the first time.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
